name: CI

# Lint and unit tests on every pull request and every push to main. publish-image.yml only publishes an
# image after this workflow passed on main, so atc.darker.dev never pulls an untested image.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      # The settings need the variables from .env.example; the tests themselves call no external service.
      - name: Test
        run: |
          cp .env.example .env
          uv run pytest --cov=winterload --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      # Builds the image Kestra runs, without pushing: a broken Dockerfile shows up in the PR, not on atc.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: GIT_SHA=${{ github.sha }}
