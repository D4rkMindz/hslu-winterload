name: Publish image

# Publishes the image the Kestra flows run in to ghcr.io/d4rkmindz/hslu-winterload (tags: latest and the commit SHA).
# atc (the standalone Kestra on srv67) pulls it; local runs keep using the image built by docker compose.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Image name
        id: image
        # ghcr.io wants lowercase names
        run: echo "name=ghcr.io/d4rkmindz/hslu-winterload" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # srv67 is x86
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
