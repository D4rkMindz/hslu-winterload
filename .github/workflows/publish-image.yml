name: Publish image

# Publishes the image the Kestra flows run in to ghcr.io/d4rkmindz/hslu-winterload (tags: latest and the commit SHA).
# atc (the standalone Kestra on srv67) pulls it; local runs keep using the image built by docker compose.
# It runs once CI (ci.yml) passed on main, so a commit that fails lint or tests never reaches atc. A manual run
# publishes the chosen branch without that check.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      # The commit CI tested; on a manual run, the chosen branch's head
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}

      - name: Image name
        id: image
        # ghcr.io wants lowercase names
        run: echo "name=ghcr.io/d4rkmindz/hslu-winterload" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # srv67 is x86
          platforms: linux/amd64
          push: true
          # Every MLflow run carries it (Dockerfile, winterload.config: GIT_SHA)
          build-args: |
            GIT_SHA=${{ env.SHA }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
