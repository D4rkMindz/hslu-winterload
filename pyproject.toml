[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "winterload"
version = "0.1.0"
description = "Winterload's project goal is to create a pipeline for a model that predicts the energy load for the next day"
requires-python = ">=3.14"
dependencies = [
    "feast[gcp]>=0.67.0,<0.68.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "openmeteo-requests>=1.7.5",
    "pandas>=2,<3",
    "pydantic-settings>=2.16.0",
    "requests>=2.34.2",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0.0",
    "s3fs>=2026.9.0",
]

[project.scripts]
winterload = "winterload.pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/winterload"]

[dependency-groups]
dev = [
    "pydevd-pycharm==262.10968.92",
]
