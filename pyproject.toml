[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "winterload"
version = "0.1.0"
description = "Winterload's project goal is to create a pipeline for a model that predicts the energy load for the next day"
requires-python = ">=3.14"
dependencies = [
    "feast[gcp]>=0.67.0,<0.68.0",
    "holidays>=0.107,<1",
    "importlib>=1.0.4",
    "jupyterlab>=4.6.4",
    "lightgbm>=4.6.0",
    "matplotlib>=3.11.2",
    "mlflow>=3,<4",
    "optuna>=5,<6",
    "evidently>=0.7.23,<0.8",
    "openmeteo-requests>=1.7.5",
    "pandas>=2,<3",
    "pydantic-settings>=2.16.0",
    "requests>=2.34.2",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0.0",
    "s3fs>=2026.9.0",
    "scikit-learn>=1.7.2",
]

[project.scripts]
winterload = "winterload.pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/winterload"]

[dependency-groups]
dev = [
    "pydevd-pycharm==262.10968.92",
    "pytest>=8.4.0",
    "ruff==0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
# notebooks are exploration; data/ holds other repos
extend-exclude = ["notebooks", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.pycodestyle]
# Lets TODO comments that list API fields run long
ignore-overlong-task-comments = true
